<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Player Activity Dashboard</title>
    <link rel="stylesheet" href="/styles/app.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Casino Backoffice</p>
          <h1>Player Activity</h1>
        </div>
        <div class="topbar-actions">
          <span id="lastUpdated" class="timestamp">Last Updated: --</span>
          <button id="refreshBtn" class="icon-button" type="button" title="Refresh data" aria-label="Refresh data">
            <span class="refresh-glyph" aria-hidden="true"></span>
          </button>
          <button id="exportBtn" class="button" type="button">Export CSV</button>
          <button id="excelBtn" class="button" type="button">Export Excel</button>
        </div>
      </header>

      <section id="summaryCards" class="summary-grid" aria-label="Player activity summary"></section>

      <section class="table-panel">
        <div class="controls">
          <label class="search-field">
            <span>Search</span>
            <input id="searchInput" type="search" placeholder="Username or email" autocomplete="off">
          </label>
          <label class="select-field">
            <span>Filter</span>
            <select id="activityFilter">
              <option value="all">All Players</option>
              <option value="today">Deposited Today</option>
              <option value="last3">Deposited Last 3 Days</option>
              <option value="last7">Deposited Last 7 Days</option>
              <option value="risk7">No Deposit 7+ Days</option>
            </select>
          </label>
          <div class="multi-field" id="brandMenu">
            <span>Casino/Brand</span>
            <button id="brandMenuButton" class="multi-button" type="button" aria-expanded="false" aria-haspopup="true">
              <span id="brandMenuLabel">All Brands</span>
              <span class="chevron" aria-hidden="true">v</span>
            </button>
            <div id="brandMenuPanel" class="multi-panel" role="menu" hidden>
              <label class="check-row">
                <input id="allBrandsCheckbox" type="checkbox" checked>
                <span>All Brands</span>
              </label>
              <div id="brandOptions" class="check-list"></div>
            </div>
          </div>
          <label class="select-field">
            <span>Rows</span>
            <select id="pageSize">
              <option>25</option>
              <option>50</option>
              <option>100</option>
            </select>
          </label>
          <div id="shownCount" class="shown-count">0 players shown</div>
        </div>

        <div id="tableStatus" class="table-status" role="status" aria-live="polite"></div>
        <div class="table-wrap">
          <table id="playersTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>

        <footer class="pagination">
          <button id="prevPage" class="button ghost" type="button">Previous</button>
          <span id="pageInfo">Page 1 of 1</span>
          <button id="nextPage" class="button ghost" type="button">Next</button>
        </footer>
      </section>
    </main>

    <script src="/scripts/app.js" type="module"></script>
  </body>
</html>
